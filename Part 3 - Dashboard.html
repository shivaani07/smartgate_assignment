<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartGate — Site Management Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0e14;
      --panel:     #111722;
      --border:    #1e2d40;
      --accent:    #00e5ff;
      --accent2:   #ff6b35;
      --green:     #00ff88;
      --yellow:    #ffd600;
      --red:       #ff3c5a;
      --text:      #c9d8e8;
      --dim:       #4a6070;
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Barlow', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 36px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,14,20,0.9);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent);
      animation: pulse-border 2s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(0,229,255,0); }
    }

    .logo-text {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .logo-text span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--dim);
    }

    .live-clock { color: var(--accent); letter-spacing: 1px; }

    .system-status {
      display: flex; align-items: center; gap: 6px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: blink-dot 1.5s ease-in-out infinite;
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      padding: 28px 36px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── PANEL BASE ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dim);
    }

    .panel-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .badge-green { background: rgba(0,255,136,0.12); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
    .badge-yellow { background: rgba(255,214,0,0.12); color: var(--yellow); border: 1px solid rgba(255,214,0,0.3); }
    .badge-red { background: rgba(255,60,90,0.12); color: var(--red); border: 1px solid rgba(255,60,90,0.3); }
    .badge-blue { background: rgba(0,229,255,0.12); color: var(--accent); border: 1px solid rgba(0,229,255,0.3); }

    /* ── GATE STATUS PANEL (left) ── */
    .gate-panel {
      grid-column: 1;
      grid-row: 1 / 3;
    }

    .gate-visual {
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Gate SVG animation */
    .gate-container {
      position: relative;
      width: 140px;
      height: 130px;
    }

    .gate-frame {
      width: 140px;
      height: 130px;
    }

    .gate-arm {
      transform-origin: 70px 20px;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gate-arm.open {
      transform: rotate(-90deg);
    }

    /* Status label */
    .status-label {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      transition: color 0.4s ease;
      text-align: center;
    }

    .status-label.opening { color: var(--yellow); }
    .status-label.open    { color: var(--accent); }
    .status-label.closing { color: var(--accent2); }

    /* LED indicator */
    .led-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--dim);
      font-family: var(--font-mono);
    }

    .led {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--dim);
      box-shadow: none;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .led.active {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow), 0 0 20px rgba(255,214,0,0.4);
      animation: led-blink 0.5s ease-in-out infinite;
    }

    @keyframes led-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Controls */
    .gate-controls {
      padding: 0 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.05); }

    .btn-primary {
      background: rgba(0,229,255,0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary:hover { background: rgba(0,229,255,0.2); }

    .btn-danger { border-color: rgba(255,60,90,0.4); color: var(--red); }
    .btn-danger:hover { background: rgba(255,60,90,0.08); border-color: var(--red); }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ── LIVE FEED PANEL ── */
    .feed-panel { grid-column: 2; grid-row: 1; }

    .feed-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Big status block */
    .live-status-block {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      border-radius: 8px;
      background: rgba(0,255,136,0.05);
      border: 1px solid rgba(0,255,136,0.2);
      transition: all 0.4s ease;
    }

    .live-status-block.opening {
      background: rgba(255,214,0,0.05);
      border-color: rgba(255,214,0,0.3);
    }

    .live-status-block.open {
      background: rgba(0,229,255,0.05);
      border-color: rgba(0,229,255,0.3);
    }

    .live-status-block.closing {
      background: rgba(255,107,53,0.05);
      border-color: rgba(255,107,53,0.3);
    }

    .status-icon {
      font-size: 36px;
      width: 56px;
      text-align: center;
      flex-shrink: 0;
    }

    .status-info { flex: 1; }

    .status-main-label {
      font-size: 24px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 1px;
      transition: color 0.4s;
      line-height: 1.2;
    }

    .status-main-label.opening { color: var(--yellow); }
    .status-main-label.open    { color: var(--accent); }
    .status-main-label.closing { color: var(--accent2); }

    .status-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Sensor readings */
    .sensor-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .sensor-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .sensor-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sensor-value {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .sensor-value span {
      font-size: 12px;
      color: var(--dim);
      margin-left: 3px;
    }

    /* Timer bar */
    .timer-section { display: flex; flex-direction: column; gap: 8px; }

    .timer-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
    }

    .timer-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.1s linear, background 0.4s;
    }

    /* ── EVENT LOG PANEL ── */
    .log-panel { grid-column: 2; grid-row: 2; }

    .log-content {
      padding: 16px;
      height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .log-entry {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.015);
      animation: log-slide 0.3s ease;
    }

    @keyframes log-slide {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .log-time { color: var(--dim); flex-shrink: 0; }
    .log-type { flex-shrink: 0; min-width: 70px; }
    .log-msg  { color: var(--text); }

    .type-info  { color: var(--accent); }
    .type-event { color: var(--green); }
    .type-warn  { color: var(--yellow); }
    .type-alert { color: var(--red); }

    /* ── SIMULATE TRIGGER BUTTON ── */
    .trigger-area {
      grid-column: 1 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .trigger-btn {
      padding: 14px 36px;
      background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,229,255,0.05));
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .trigger-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .trigger-btn:hover::before { opacity: 0.08; }
    .trigger-btn:active { transform: scale(0.97); }
    .trigger-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .trigger-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <div class="logo-icon">SG</div>
    <div class="logo-text">Smart<span>Gate</span></div>
  </div>
  <div class="header-right">
    <div class="system-status"><div class="dot"></div> SYSTEM ONLINE</div>
    <div class="live-clock" id="clock">--:--:--</div>
  </div>
</header>

<!-- ── MAIN GRID ── -->
<main>

  <!-- LEFT: Gate Panel -->
  <div class="panel gate-panel">
    <div class="panel-header">
      <span class="panel-title">Gate Control</span>
      <span class="panel-badge badge-green" id="gateBadge">CLOSED</span>
    </div>

    <div class="gate-visual">
      <!-- SVG Gate -->
      <div class="gate-container">
        <svg class="gate-frame" viewBox="0 0 140 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Posts -->
          <rect x="60" y="12" width="8" height="110" rx="2" fill="#1e2d40"/>
          <rect x="60" y="12" width="8" height="110" rx="2" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
          <!-- Post cap -->
          <rect x="56" y="8" width="16" height="6" rx="2" fill="#00e5ff" opacity="0.6"/>
          <!-- Base -->
          <rect x="20" y="118" width="100" height="6" rx="3" fill="#1e2d40" stroke="#2a3d52" stroke-width="1"/>

          <!-- Gate arm (rotates) -->
          <g class="gate-arm" id="gateArm">
            <rect x="68" y="20" width="58" height="7" rx="3" fill="#00e5ff" opacity="0.9"/>
            <!-- Stripes on arm -->
            <rect x="80" y="21" width="6" height="5" rx="1" fill="#ff6b35" opacity="0.7"/>
            <rect x="96" y="21" width="6" height="5" rx="1" fill="#ff6b35" opacity="0.7"/>
            <rect x="112" y="21" width="6" height="5" rx="1" fill="#ff6b35" opacity="0.7"/>
          </g>

          <!-- Pivot circle -->
          <circle cx="70" cy="23" r="5" fill="#0a0e14" stroke="#00e5ff" stroke-width="1.5"/>
          <circle cx="70" cy="23" r="2" fill="#00e5ff"/>
        </svg>
      </div>

      <div class="status-label" id="gateStatusLabel">GATE CLOSED</div>

      <div class="led-row">
        <div class="led" id="motionLed"></div>
        <span>MOTION LED</span>
      </div>
    </div>

    <div class="divider"></div>
    <div class="gate-controls">
      <button class="btn btn-primary" onclick="simulateTrigger()">⚡ Simulate Vehicle</button>
      <button class="btn btn-danger" onclick="forceClose()">✕ Force Close</button>
    </div>
  </div>

  <!-- RIGHT TOP: Live Feed Panel -->
  <div class="panel feed-panel">
    <div class="panel-header">
      <span class="panel-title">Live Feed</span>
      <span class="panel-badge badge-blue" id="feedBadge">MONITORING</span>
    </div>

    <div class="feed-content">
      <!-- Big status -->
      <div class="live-status-block" id="statusBlock">
        <div class="status-icon" id="statusIcon">🔒</div>
        <div class="status-info">
          <div class="status-main-label" id="statusMainLabel">Gate Closed</div>
          <div class="status-sub" id="statusSub">Monitoring for vehicles · HC-SR04 active</div>
        </div>
      </div>

      <!-- Sensor readings -->
      <div class="sensor-row">
        <div class="sensor-card">
          <div class="sensor-label">Distance</div>
          <div class="sensor-value" id="distanceVal">—<span>cm</span></div>
        </div>
        <div class="sensor-card">
          <div class="sensor-label">Gate Angle</div>
          <div class="sensor-value" id="angleVal">0<span>°</span></div>
        </div>
        <div class="sensor-card">
          <div class="sensor-label">Events Today</div>
          <div class="sensor-value" id="eventCount">0</div>
        </div>
      </div>

      <!-- Timer -->
      <div class="timer-section">
        <div class="timer-label">
          <span>Auto-close timer</span>
          <span id="timerText">—</span>
        </div>
        <div class="timer-bar">
          <div class="timer-fill" id="timerFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT BOTTOM: Event Log -->
  <div class="panel log-panel">
    <div class="panel-header">
      <span class="panel-title">Event Log</span>
      <span class="panel-badge badge-blue" id="logCount">0 EVENTS</span>
    </div>
    <div class="log-content" id="logContent">
      <!-- Logs injected here -->
    </div>
  </div>

</main>

<script>
  // ── STATE ──
  let gateState = 'closed'; // closed | opening | open | closing
  let timerInterval = null;
  let timerProgress = 0;
  let eventCount = 0;
  let currentAngle = 0;
  const OPEN_DURATION = 5000;

  // ── CLOCK ──
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toTimeString().slice(0,8);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── LOGGING ──
  function addLog(type, msg) {
    const log = document.getElementById('logContent');
    const now = new Date().toTimeString().slice(0,8);
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `
      <span class="log-time">${now}</span>
      <span class="log-type type-${type}">[${type.toUpperCase()}]</span>
      <span class="log-msg">${msg}</span>
    `;
    log.prepend(entry);
    eventCount++;
    document.getElementById('logCount').textContent = `${eventCount} EVENTS`;
  }

  // ── UI UPDATER ──
  function updateUI(state, distanceCm) {
    const block     = document.getElementById('statusBlock');
    const icon      = document.getElementById('statusIcon');
    const mainLabel = document.getElementById('statusMainLabel');
    const sub       = document.getElementById('statusSub');
    const badge     = document.getElementById('gateBadge');
    const gateLabel = document.getElementById('gateStatusLabel');
    const arm       = document.getElementById('gateArm');
    const led       = document.getElementById('motionLed');
    const angleEl   = document.getElementById('angleVal');
    const distEl    = document.getElementById('distanceVal');

    // Remove all state classes
    block.className     = 'live-status-block';
    mainLabel.className = 'status-main-label';
    gateLabel.className = 'status-label';

    if (distanceCm !== undefined) distEl.innerHTML = `${distanceCm}<span>cm</span>`;

    switch(state) {
      case 'opening':
        block.classList.add('opening');
        mainLabel.classList.add('opening');
        gateLabel.classList.add('opening');
        icon.textContent = '🚗';
        mainLabel.textContent = 'Gate Opening...';
        sub.textContent = 'Vehicle detected · Lifting barrier';
        badge.textContent = 'OPENING';
        badge.className = 'panel-badge badge-yellow';
        gateLabel.textContent = 'OPENING';
        arm.classList.add('open');
        led.classList.add('active');
        animateAngle(0, 90, 800);
        break;

      case 'open':
        block.classList.add('open');
        mainLabel.classList.add('open');
        gateLabel.classList.add('open');
        icon.textContent = '✅';
        mainLabel.textContent = 'Gate Open';
        sub.textContent = 'Vehicle passed · Auto-close in 5s';
        badge.textContent = 'OPEN';
        badge.className = 'panel-badge badge-blue';
        gateLabel.textContent = 'GATE OPEN';
        arm.classList.add('open');
        led.classList.add('active');
        angleEl.innerHTML = `90<span>°</span>`;
        break;

      case 'closing':
        block.classList.add('closing');
        mainLabel.classList.add('closing');
        gateLabel.classList.add('closing');
        icon.textContent = '🔄';
        mainLabel.textContent = 'Gate Closing...';
        sub.textContent = 'Path clear · Lowering barrier';
        badge.textContent = 'CLOSING';
        badge.className = 'panel-badge badge-yellow';
        gateLabel.textContent = 'CLOSING';
        arm.classList.remove('open');
        led.classList.add('active');
        animateAngle(90, 0, 800);
        break;

      case 'closed':
        icon.textContent = '🔒';
        mainLabel.textContent = 'Gate Closed';
        sub.textContent = 'Monitoring for vehicles · HC-SR04 active';
        badge.textContent = 'CLOSED';
        badge.className = 'panel-badge badge-green';
        gateLabel.textContent = 'GATE CLOSED';
        arm.classList.remove('open');
        led.classList.remove('active');
        animateAngle(currentAngle, 0, 800);
        distEl.innerHTML = `—<span>cm</span>`;
        break;
    }
  }

  function animateAngle(from, to, duration) {
    const start = performance.now();
    const el = document.getElementById('angleVal');
    function step(now) {
      const t = Math.min((now - start) / duration, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const angle = Math.round(from + (to - from) * ease);
      el.innerHTML = `${angle}<span>°</span>`;
      currentAngle = angle;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ── TIMER BAR ──
  function startTimer() {
    clearTimerBar();
    const fill = document.getElementById('timerFill');
    const timerText = document.getElementById('timerText');
    const start = Date.now();

    timerInterval = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.min((elapsed / OPEN_DURATION) * 100, 100);
      const remaining = Math.max(0, Math.ceil((OPEN_DURATION - elapsed) / 1000));
      fill.style.width = pct + '%';
      timerText.textContent = `${remaining}s remaining`;

      if (elapsed >= OPEN_DURATION) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerText.textContent = 'Closing...';
        closeGate();
      }
    }, 50);
  }

  function clearTimerBar() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    document.getElementById('timerFill').style.width = '0%';
    document.getElementById('timerText').textContent = '—';
  }

  // ── GATE LOGIC ──
  function simulateTrigger() {
    if (gateState !== 'closed') return;

    const dist = Math.floor(Math.random() * 15) + 3; // 3–17 cm
    document.getElementById('distanceVal').innerHTML = `${dist}<span>cm</span>`;
    document.getElementById('eventCount').textContent = ++eventCount;
    addLog('alert', `Vehicle detected at ${dist} cm — opening gate`);

    gateState = 'opening';
    updateUI('opening', dist);

    setTimeout(() => {
      gateState = 'open';
      updateUI('open');
      addLog('event', 'Gate fully open · Auto-close timer started');
      startTimer();
    }, 900);
  }

  function closeGate() {
    if (gateState !== 'open') return;
    gateState = 'closing';
    updateUI('closing');
    addLog('warn', 'Path clear — closing gate');

    setTimeout(() => {
      gateState = 'closed';
      updateUI('closed');
      addLog('info', 'Gate closed and secured');
    }, 900);
  }

  function forceClose() {
    clearTimerBar();
    gateState = 'closing';
    updateUI('closing');
    addLog('warn', 'Manual override — force closing gate');
    setTimeout(() => {
      gateState = 'closed';
      updateUI('closed');
      addLog('info', 'Gate force-closed by operator');
    }, 900);
  }

  // ── INIT LOG ──
  addLog('info', 'Smart Gate system initialized');
  addLog('info', 'HC-SR04 sensor online · Servo ready');
</script>
</body>
</html>
